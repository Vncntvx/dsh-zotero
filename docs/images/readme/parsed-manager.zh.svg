<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">解析管理中的全文索引和条目</title>
  <desc id="desc">右侧解析管理标签页提供状态筛选和解析入口，显示一篇可全文检索的文档。</desc>
  <style>
    text { fill: #1e293b; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .small { font-size: 14px; }
    .muted { fill: #526378; }
    .label { font-weight: 600; }
    .heading { font-size: 22px; font-weight: 650; }
    .lead { font-size: 18px; font-weight: 600; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .math { font: 26px Georgia, "Times New Roman", serif; }
    .paper { fill: #fff; }
    .pane { fill: #f8fafc; }
    .chrome { fill: #f1f5f9; }
    .code { fill: #edf2f7; }
    .select { fill: #0d9488; fill-opacity: .11; }
    .accent { fill: #0f766e; }
    .warning { fill: #92400e; }
    .warning-bg { fill: #fffbeb; }
    .border { stroke: #94a3b8; stroke-opacity: .65; }
    .rule { stroke: #94a3b8; stroke-opacity: .42; }
    .edge { stroke: #0d9488; stroke-width: 2; }
    .placeholder { stroke: #1e293b; stroke-opacity: .17; stroke-width: 3; stroke-linecap: round; }
    .icon { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <clipPath id="application-clip"><rect x="0" y="0" width="800" height="500" rx="10"/></clipPath>
    <clipPath id="session-header-clip"><rect x="35" y="0" width="190" height="61" rx="0"/></clipPath>
    <clipPath id="background-conversation-clip"><rect x="35" y="62" width="190" height="438" rx="0"/></clipPath>
  </defs>
  <g id="application" clip-path="url(#application-clip)">
  <rect x="0" y="0" width="800" height="500" rx="0" class="paper"/>
  <rect x="0" y="0" width="34" height="500" rx="0" class="chrome"/>
  <path d="M34 0L34 500" class="rule"/>
  <rect x="35" y="0" width="765" height="61" rx="0" class="pane"/>
  <path d="M34 61L800 61" class="rule"/>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(9 13)" class="icon"/>
  <path d="M8 3v10M3 8h10" transform="translate(9 56)" class="icon"/>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(9 89)" class="icon"/>
  <path d="M1.5 4h5l1.7 2h6.3v6.5h-13ZM1.5 4V2.8h5L8 4h5v2" transform="translate(9 122)" class="icon"/>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(9 155)" class="icon"/>
  <g id="session-header" clip-path="url(#session-header-clip)">
  <text x="48" y="22" class="small label" text-anchor="start">Transformer 架构起源…</text>
  <rect x="42" y="33" width="48" height="25" rx="4" class="select"/>
  <path d="M49 59L83 59" class="edge"/>
  <text x="50" y="51" class="small label accent" text-anchor="start">对话</text>
  <text x="101" y="51" class="small muted" text-anchor="start">轨迹</text>
  </g>
  <rect x="225" y="0" width="575" height="500" rx="0" class="pane"/>
  <path d="M225 0L225 500" class="rule"/>
  <path d="M225 31L800 31" class="rule"/>
  <text x="240" y="21" class="small muted" text-anchor="start">Vaswani et al. 2017</text>
  <text x="375" y="21" class="small muted" text-anchor="start">文献面板</text>
  <text x="498" y="21" class="small muted" text-anchor="start">PDF 全文</text>
  <rect x="597" y="3" width="155" height="25" rx="4" class="select"/>
  <path d="M604 29L745 29" class="edge"/>
  <text x="605" y="21" class="small label accent" text-anchor="start">解析管理</text>
  <path d="M8 3v10M3 8h10" transform="translate(759 8)" class="icon"/>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(774 11)" class="icon"/>
  <g id="background-conversation" clip-path="url(#background-conversation-clip)">
  <rect x="70" y="77" width="143" height="54" rx="5" class="chrome"/>
  <path d="M83 93L195 93" class="placeholder"/>
  <path d="M83 105L170 105" class="placeholder"/>
  <path d="M83 117L187 117" class="placeholder"/>
  <path d="M48 158L154 158" class="placeholder"/>
  <path d="M48 194L191 194" class="placeholder"/>
  <path d="M48 208L169 208" class="placeholder"/>
  <path d="M48 222L202 222" class="placeholder"/>
  <path d="M48 256L201 256" class="placeholder"/>
  <path d="M48 270L176 270" class="placeholder"/>
  <path d="M48 284L190 284" class="placeholder"/>
  <path d="M48 298L149 298" class="placeholder"/>
  <path d="M48 340L194 340" class="placeholder"/>
  <path d="M48 354L200 354" class="placeholder"/>
  <path d="M48 368L132 368" class="placeholder"/>
  <g id="composer">
  <rect x="45" y="453" width="169" height="36" rx="7" class="pane border"/>
  <path d="M8 3v10M3 8h10" transform="translate(54 463)" class="icon"/>
  <text x="78" y="476" class="small muted" text-anchor="start">发送消息…</text>
  <path d="M8 13V3M4 7l4-4 4 4" transform="translate(189 463)" class="icon"/>
  </g>
  </g>
  <g id="parsed-document-manager">
  <rect x="237" y="44" width="43" height="21" rx="4" class="select"/>
  <text x="258.5" y="59" class="small accent label" text-anchor="middle">全部</text>
  <rect x="286" y="44" width="62" height="21" rx="4" class="chrome"/>
  <text x="317.0" y="59" class="small muted" text-anchor="middle">正常</text>
  <rect x="354" y="44" width="77" height="21" rx="4" class="chrome"/>
  <text x="392.5" y="59" class="small muted" text-anchor="middle">孤立</text>
  <rect x="437" y="44" width="77" height="21" rx="4" class="chrome"/>
  <text x="475.5" y="59" class="small muted" text-anchor="middle">损坏</text>
  <rect x="237" y="74" width="275" height="26" rx="4" class="paper border"/>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(243 79)" class="icon"/>
  <text x="265" y="92" class="small muted" text-anchor="start">搜索标题或来源</text>
  <rect x="520" y="74" width="120" height="26" rx="4" class="paper border"/>
  <text x="580.0" y="92" class="small" text-anchor="middle">解析 PDF URL</text>
  <rect x="646" y="74" width="130" height="26" rx="4" class="paper border"/>
  <text x="711.0" y="92" class="small" text-anchor="middle">批量解析 PDF</text>
  <path d="M225 111L800 111" class="rule"/>
  <circle cx="242" cy="134" r="3" class="accent"/>
  <text x="253" y="140" class="label" text-anchor="start">全文检索 · 1/1 篇文档可搜索</text>
  <text x="237" y="177" class="small muted" text-anchor="start">共 1 个文档</text>
  <text x="783" y="177" class="small muted" text-anchor="end">全选</text>
  <path d="M237 189L787 189" class="rule"/>
  <rect x="237" y="205" width="15" height="15" rx="2" class="paper border"/>
  <text x="262" y="219" class="lead" text-anchor="start">Attention Is All You Need</text>
  <text x="262" y="243" class="small muted" text-anchor="start">附件 9VWQ8CZ9 · 4 分钟前 · 41 KB · 42,187 字符</text>
  <path d="M1 8s2.5-4.5 7-4.5S15 8 15 8s-2.5 4.5-7 4.5S1 8 1 8ZM10 8a2 2 0 1 0-4 0 2 2 0 0 0 4 0Z" transform="translate(711 229)" class="icon"/>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(739 229)" class="icon"/>
  <path d="M2.5 4h11M4 4l.7 10h6.6L12 4M6 4V1.8h4V4M7 6.5v5m2-5v5" transform="translate(768 229)" class="icon"/>
  </g>
  </g>
  <rect x="0.5" y="0.5" width="799" height="499" rx="10" class="border" fill="none"/>
</svg>
