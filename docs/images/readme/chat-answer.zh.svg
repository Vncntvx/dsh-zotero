<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">摘要证据与论文时间线</title>
  <desc id="desc">同一会话中关于思维链的摘要摘录，以及 2017 至 2022 年的四篇论文。</desc>
  <style>
    text { fill: #1e293b; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .small { font-size: 14px; }
    .muted { fill: #526378; }
    .label { font-weight: 600; }
    .heading { font-size: 22px; font-weight: 650; }
    .lead { font-size: 18px; font-weight: 600; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .math { font: 26px Georgia, "Times New Roman", serif; }
    .paper { fill: #fff; }
    .pane { fill: #f8fafc; }
    .chrome { fill: #f1f5f9; }
    .code { fill: #edf2f7; }
    .select { fill: #0d9488; fill-opacity: .11; }
    .accent { fill: #0f766e; }
    .warning { fill: #92400e; }
    .warning-bg { fill: #fffbeb; }
    .border { stroke: #94a3b8; stroke-opacity: .65; }
    .rule { stroke: #94a3b8; stroke-opacity: .42; }
    .edge { stroke: #0d9488; stroke-width: 2; }
    .placeholder { stroke: #1e293b; stroke-opacity: .17; stroke-width: 3; stroke-linecap: round; }
    .icon { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <clipPath id="application-clip"><rect x="0" y="0" width="800" height="500" rx="10"/></clipPath>
  </defs>
  <g id="application" clip-path="url(#application-clip)">
  <rect x="0" y="0" width="800" height="500" rx="0" class="paper"/>
  <rect x="0" y="0" width="34" height="500" rx="0" class="chrome"/>
  <path d="M34 0L34 500" class="rule"/>
  <rect x="35" y="0" width="765" height="61" rx="0" class="pane"/>
  <path d="M34 61L800 61" class="rule"/>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(9 13)" class="icon"/>
  <path d="M8 3v10M3 8h10" transform="translate(9 56)" class="icon"/>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(9 89)" class="icon"/>
  <path d="M1.5 4h5l1.7 2h6.3v6.5h-13ZM1.5 4V2.8h5L8 4h5v2" transform="translate(9 122)" class="icon"/>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(9 155)" class="icon"/>
  <text x="48" y="22" class="small label" text-anchor="start">梳理 Transformer 架构起源论文</text>
  <rect x="42" y="33" width="48" height="25" rx="4" class="select"/>
  <path d="M49 59L83 59" class="edge"/>
  <text x="50" y="51" class="small label accent" text-anchor="start">对话</text>
  <text x="101" y="51" class="small muted" text-anchor="start">轨迹</text>
  <text x="152" y="51" class="small muted" text-anchor="start">文献轨迹</text>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(774 11)" class="icon"/>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(76 75)" class="icon"/>
  <text x="101" y="89" class="mono accent" text-anchor="start">zotero_retrieve</text>
  <text x="273" y="89" class="label" text-anchor="start">提取 1 条原文片段</text>
  <rect x="96" y="101" width="664" height="107" rx="5" class="pane border"/>
  <rect x="108" y="110" width="76" height="21" rx="4" class="select"/>
  <text x="146.0" y="125" class="small accent label" text-anchor="middle">摘要</text>
  <rect x="193" y="110" width="133" height="21" rx="4" class="chrome"/>
  <text x="259.5" y="125" class="small muted" text-anchor="middle">命中查询词</text>
  <text x="747" y="126" class="small accent" text-anchor="end">复制  ·  在 Zotero 中打开  ·  复制链接</text>
  <text x="109" y="150" class="" text-anchor="start">We explore how generating a chain of thought — a series of intermediate reasoning</text>
  <text x="109" y="171" class="" text-anchor="start">steps — significantly improves the ability of large language models to perform</text>
  <text x="109" y="192" class="" text-anchor="start">complex reasoning.</text>
  <text x="76" y="237" class="small" text-anchor="start">库内共 11 篇文献，「语言模型与注意力」合集收录其中 4 篇主线论文。</text>
  <text x="76" y="285" class="heading" text-anchor="start">时间脉络一览</text>
  <text x="76" y="313" class="small muted" text-anchor="start">年份</text>
  <text x="144" y="313" class="small muted" text-anchor="start">论文</text>
  <text x="550" y="313" class="small muted" text-anchor="start">角色</text>
  <path d="M76 320L760 320" class="rule"/>
  <text x="76" y="339" class="small mono" text-anchor="start">2017</text>
  <text x="144" y="339" class="small label" text-anchor="start">Attention Is All You Need (Vaswani et al.)</text>
  <text x="550" y="339" class="small" text-anchor="start">架构起源</text>
  <path d="M76 348L760 348" class="rule"/>
  <text x="76" y="367" class="small mono" text-anchor="start">2019</text>
  <text x="144" y="367" class="small" text-anchor="start">BERT (Devlin et al.)</text>
  <text x="550" y="367" class="small" text-anchor="start">编码器路线</text>
  <path d="M76 376L760 376" class="rule"/>
  <text x="76" y="395" class="small mono" text-anchor="start">2020</text>
  <text x="144" y="395" class="small" text-anchor="start">Language Models are Few-Shot Learners (Brown et al.)</text>
  <text x="550" y="395" class="small" text-anchor="start">解码器路线 + 规模化</text>
  <path d="M76 404L760 404" class="rule"/>
  <text x="76" y="423" class="small mono" text-anchor="start">2022</text>
  <text x="144" y="423" class="small" text-anchor="start">Chain-of-Thought Prompting (Wei et al.)</text>
  <text x="550" y="423" class="small" text-anchor="start">能力涌现</text>
  <g id="composer">
  <rect x="76" y="453" width="684" height="36" rx="7" class="pane border"/>
  <path d="M8 3v10M3 8h10" transform="translate(85 463)" class="icon"/>
  <text x="109" y="476" class="small muted" text-anchor="start">发送消息或创建任务</text>
  <path d="M8 13V3M4 7l4-4 4 4" transform="translate(735 463)" class="icon"/>
  </g>
  </g>
  <rect x="0.5" y="0.5" width="799" height="499" rx="10" class="border" fill="none"/>
</svg>
