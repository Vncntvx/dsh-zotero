<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">注意力原文定义与缩放点积公式</title>
  <desc id="desc">正文摘录与论文第 3.2.1 节的公式 (1)，以及第 3.2.2 节的多头定义摘录。</desc>
  <style>
    text { fill: #1e293b; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .small { font-size: 14px; }
    .muted { fill: #526378; }
    .label { font-weight: 600; }
    .heading { font-size: 22px; font-weight: 650; }
    .lead { font-size: 18px; font-weight: 600; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .math { font: 26px Georgia, "Times New Roman", serif; }
    .paper { fill: #fff; }
    .pane { fill: #f8fafc; }
    .chrome { fill: #f1f5f9; }
    .code { fill: #edf2f7; }
    .select { fill: #0d9488; fill-opacity: .11; }
    .accent { fill: #0f766e; }
    .warning { fill: #92400e; }
    .warning-bg { fill: #fffbeb; }
    .border { stroke: #94a3b8; stroke-opacity: .65; }
    .rule { stroke: #94a3b8; stroke-opacity: .42; }
    .edge { stroke: #0d9488; stroke-width: 2; }
    .placeholder { stroke: #1e293b; stroke-opacity: .17; stroke-width: 3; stroke-linecap: round; }
    .icon { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <clipPath id="application-clip"><rect x="0" y="0" width="800" height="500" rx="10"/></clipPath>
  </defs>
  <g id="application" clip-path="url(#application-clip)">
  <rect x="0" y="0" width="800" height="500" rx="0" class="paper"/>
  <rect x="0" y="0" width="34" height="500" rx="0" class="chrome"/>
  <path d="M34 0L34 500" class="rule"/>
  <rect x="35" y="0" width="765" height="61" rx="0" class="pane"/>
  <path d="M34 61L800 61" class="rule"/>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(9 13)" class="icon"/>
  <path d="M8 3v10M3 8h10" transform="translate(9 56)" class="icon"/>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(9 89)" class="icon"/>
  <path d="M1.5 4h5l1.7 2h6.3v6.5h-13ZM1.5 4V2.8h5L8 4h5v2" transform="translate(9 122)" class="icon"/>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(9 155)" class="icon"/>
  <text x="48" y="22" class="small label" text-anchor="start">梳理 Transformer 架构起源论文</text>
  <rect x="42" y="33" width="48" height="25" rx="4" class="select"/>
  <path d="M49 59L83 59" class="edge"/>
  <text x="50" y="51" class="small label accent" text-anchor="start">对话</text>
  <text x="101" y="51" class="small muted" text-anchor="start">轨迹</text>
  <text x="152" y="51" class="small muted" text-anchor="start">文献轨迹</text>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(774 11)" class="icon"/>
  <text x="76" y="91" class="lead" text-anchor="start">1. 注意力的一般定义（§3.2 开头）</text>
  <rect x="76" y="102" width="684" height="92" rx="4" class="select"/>
  <path d="M77 105L77 191" class="edge"/>
  <text x="88" y="120" class="" text-anchor="start">An attention function can be described as mapping a query and a set of</text>
  <text x="88" y="136" class="" text-anchor="start">key-value pairs to an output, where the query, keys, values, and output</text>
  <text x="88" y="152" class="" text-anchor="start">are all vectors. The output is computed as a weighted sum of the values,</text>
  <text x="88" y="168" class="" text-anchor="start">where the weight assigned to each value is computed by a compatibility function</text>
  <text x="88" y="184" class="" text-anchor="start">of the query with the corresponding key.</text>
  <text x="76" y="216" class="lead" text-anchor="start">2. 缩放点积注意力（§3.2.1，式 (1)）</text>
  <rect x="76" y="226" width="684" height="50" rx="4" class="select"/>
  <path d="M77 229L77 273" class="edge"/>
  <text x="88" y="244" class="" text-anchor="start">We compute the dot products of the query with all keys, divide each by √dₖ,</text>
  <text x="88" y="263" class="" text-anchor="start">and apply a softmax function to obtain the weights on the values.</text>
  <g id="scaled-dot-product-equation">
  <text x="203" y="314" class="math" text-anchor="start">Attention(Q, K, V) = softmax</text>
  <path d="M548 282Q534 309 548 330 M617 282Q631 309 617 330" fill="none" stroke="#1e293b" stroke-width="1.4"/>
  <text x="582" y="301" class="math" text-anchor="middle">QK<tspan dy="-9" font-size="15">T</tspan></text>
  <path d="M553 308L613 308" class="edge"/>
  <path d="M561 323l5-3 5 12 6-17h24" fill="none" stroke="#1e293b" stroke-width="1.35"/>
  <text x="579" y="329" class="serif lead" text-anchor="start">d<tspan dy="4" font-size="13">k</tspan></text>
  <text x="635" y="314" class="math" text-anchor="start">V</text>
  <text x="751" y="313" class="small muted" text-anchor="end">(1)</text>
  </g>
  <text x="76" y="354" class="lead" text-anchor="start">3. 多头注意力（§3.2.2）</text>
  <rect x="76" y="363" width="684" height="80" rx="4" class="select"/>
  <path d="M77 366L77 440" class="edge"/>
  <text x="88" y="381" class="" text-anchor="start">… we found it beneficial to linearly project the queries, keys and values h times</text>
  <text x="88" y="398" class="" text-anchor="start">with different, learned linear projections to dₖ, dₖ and dᵥ dimensions, respectively.</text>
  <text x="88" y="415" class="" text-anchor="start">… we then perform the attention function in parallel, yielding dᵥ-dimensional</text>
  <text x="88" y="432" class="" text-anchor="start">output values. These are concatenated and once again projected …</text>
  <g id="composer">
  <rect x="76" y="453" width="684" height="36" rx="7" class="pane border"/>
  <path d="M8 3v10M3 8h10" transform="translate(85 463)" class="icon"/>
  <text x="109" y="476" class="small muted" text-anchor="start">发送消息或创建任务</text>
  <path d="M8 13V3M4 7l4-4 4 4" transform="translate(735 463)" class="icon"/>
  </g>
  </g>
  <rect x="0.5" y="0.5" width="799" height="499" rx="10" class="border" fill="none"/>
</svg>
