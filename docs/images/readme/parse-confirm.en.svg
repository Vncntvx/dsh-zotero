<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">MinerU PDF submission dialog</title>
  <desc id="desc">The modal over the literature panel shows the external service, submission mode, file limits, background parsing notice, and submit button.</desc>
  <style>
    text { fill: #1e293b; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .small { font-size: 14px; }
    .muted { fill: #526378; }
    .label { font-weight: 600; }
    .heading { font-size: 22px; font-weight: 650; }
    .lead { font-size: 18px; font-weight: 600; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .math { font: 26px Georgia, "Times New Roman", serif; }
    .paper { fill: #fff; }
    .pane { fill: #f8fafc; }
    .chrome { fill: #f1f5f9; }
    .code { fill: #edf2f7; }
    .select { fill: #0d9488; fill-opacity: .11; }
    .accent { fill: #0f766e; }
    .warning { fill: #92400e; }
    .warning-bg { fill: #fffbeb; }
    .border { stroke: #94a3b8; stroke-opacity: .65; }
    .rule { stroke: #94a3b8; stroke-opacity: .42; }
    .edge { stroke: #0d9488; stroke-width: 2; }
    .placeholder { stroke: #1e293b; stroke-opacity: .17; stroke-width: 3; stroke-linecap: round; }
    .icon { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <clipPath id="application-clip"><rect x="0" y="0" width="800" height="500" rx="10"/></clipPath>
    <clipPath id="session-header-clip"><rect x="35" y="0" width="190" height="61" rx="0"/></clipPath>
    <clipPath id="background-conversation-clip"><rect x="35" y="62" width="190" height="438" rx="0"/></clipPath>
    <clipPath id="library-items-clip"><rect x="339" y="77" width="226" height="423" rx="0"/></clipPath>
  </defs>
  <g id="application" clip-path="url(#application-clip)">
  <rect x="0" y="0" width="800" height="500" rx="0" class="paper"/>
  <rect x="0" y="0" width="34" height="500" rx="0" class="chrome"/>
  <path d="M34 0L34 500" class="rule"/>
  <rect x="35" y="0" width="765" height="61" rx="0" class="pane"/>
  <path d="M34 61L800 61" class="rule"/>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(9 13)" class="icon"/>
  <path d="M8 3v10M3 8h10" transform="translate(9 56)" class="icon"/>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(9 89)" class="icon"/>
  <path d="M1.5 4h5l1.7 2h6.3v6.5h-13ZM1.5 4V2.8h5L8 4h5v2" transform="translate(9 122)" class="icon"/>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(9 155)" class="icon"/>
  <g id="session-header" clip-path="url(#session-header-clip)">
  <text x="48" y="22" class="small label" text-anchor="start">Transformer origins…</text>
  <rect x="42" y="33" width="48" height="25" rx="4" class="select"/>
  <path d="M49 59L83 59" class="edge"/>
  <text x="50" y="51" class="small label accent" text-anchor="start">Chat</text>
  <text x="101" y="51" class="small muted" text-anchor="start">Trace</text>
  </g>
  <rect x="225" y="0" width="575" height="500" rx="0" class="pane"/>
  <path d="M225 0L225 500" class="rule"/>
  <path d="M225 31L800 31" class="rule"/>
  <text x="240" y="21" class="small muted" text-anchor="start">Vaswani et al. 2017</text>
  <rect x="367" y="3" width="120" height="25" rx="4" class="select"/>
  <path d="M374 29L480 29" class="edge"/>
  <text x="375" y="21" class="small label accent" text-anchor="start">Literature panel</text>
  <path d="M8 3v10M3 8h10" transform="translate(494 8)" class="icon"/>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(774 11)" class="icon"/>
  <g id="background-conversation" clip-path="url(#background-conversation-clip)">
  <rect x="70" y="77" width="143" height="54" rx="5" class="chrome"/>
  <path d="M83 93L195 93" class="placeholder"/>
  <path d="M83 105L170 105" class="placeholder"/>
  <path d="M83 117L187 117" class="placeholder"/>
  <path d="M48 158L154 158" class="placeholder"/>
  <path d="M48 194L191 194" class="placeholder"/>
  <path d="M48 208L169 208" class="placeholder"/>
  <path d="M48 222L202 222" class="placeholder"/>
  <path d="M48 256L201 256" class="placeholder"/>
  <path d="M48 270L176 270" class="placeholder"/>
  <path d="M48 284L190 284" class="placeholder"/>
  <path d="M48 298L149 298" class="placeholder"/>
  <path d="M48 340L194 340" class="placeholder"/>
  <path d="M48 354L200 354" class="placeholder"/>
  <path d="M48 368L132 368" class="placeholder"/>
  <g id="composer">
  <rect x="45" y="453" width="169" height="36" rx="7" class="pane border"/>
  <path d="M8 3v10M3 8h10" transform="translate(54 463)" class="icon"/>
  <text x="78" y="476" class="small muted" text-anchor="start">Send a message</text>
  <path d="M8 13V3M4 7l4-4 4 4" transform="translate(189 463)" class="icon"/>
  </g>
  </g>
  <g id="library-panel">
  <rect x="226" y="32" width="574" height="43" rx="0" class="pane"/>
  <rect x="234" y="41" width="104" height="26" rx="4" class="paper border"/>
  <text x="286.0" y="59" class="small" text-anchor="middle">My Library</text>
  <path d="m4 6 4 4 4-4" transform="translate(317 46)" class="icon"/>
  <path d="M3 1.5h6l4 4v9H3Zm6 0v4h4M5.5 8h5m-5 3h5" transform="translate(347 46)" class="icon"/>
  <text x="367" y="59" class="small" text-anchor="start">Manage parsed docs</text>
  <rect x="507" y="41" width="152" height="26" rx="4" class="paper border"/>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(514 46)" class="icon"/>
  <text x="535" y="59" class="small muted" text-anchor="start">Search title…</text>
  <rect x="666" y="41" width="83" height="26" rx="4" class="paper border"/>
  <text x="707.5" y="59" class="small" text-anchor="middle">Modified</text>
  <circle cx="758" cy="54" r="3" class="accent"/>
  <path d="M13.5 5a6 6 0 1 0 .4 4.3M13.5 1.8v3.8H9.6" transform="translate(773 46)" class="icon"/>
  <path d="M225 76L800 76" class="rule"/>
  <g id="collection-tree">
  <rect x="226" y="77" width="112" height="423" rx="0" class="chrome"/>
  <path d="M338 76L338 500" class="rule"/>
  <rect x="230" y="91" width="103" height="26" rx="4" class="select"/>
  <path d="M231 94L231 114" class="edge"/>
  <text x="239" y="109" class="small label" text-anchor="start">All items</text>
  <text x="239" y="137" class="small muted" text-anchor="start">Publications</text>
  <text x="239" y="165" class="small muted" text-anchor="start">Trash</text>
  <text x="237" y="197" class="small muted" text-anchor="start">Collections</text>
  <path d="M1.5 4h5l1.7 2h6.3v6.5h-13ZM1.5 4V2.8h5L8 4h5v2" transform="translate(235 212)" class="icon"/>
  <text x="255" y="224" class="small" text-anchor="start">Vision…</text>
  <path d="M1.5 4h5l1.7 2h6.3v6.5h-13ZM1.5 4V2.8h5L8 4h5v2" transform="translate(235 240)" class="icon"/>
  <text x="255" y="252" class="small" text-anchor="start">Language…</text>
  <path d="M1.5 4h5l1.7 2h6.3v6.5h-13ZM1.5 4V2.8h5L8 4h5v2" transform="translate(235 268)" class="icon"/>
  <text x="255" y="280" class="small" text-anchor="start">Surveys…</text>
  </g>
  <g id="library-items" clip-path="url(#library-items-clip)">
  <rect x="346" y="88" width="61" height="21" rx="4" class="chrome"/>
  <text x="376.5" y="103" class="small muted" text-anchor="middle">Type</text>
  <rect x="410" y="88" width="52" height="21" rx="4" class="chrome"/>
  <text x="436.0" y="103" class="small muted" text-anchor="middle">Tags</text>
  <rect x="465" y="88" width="93" height="21" rx="4" class="chrome"/>
  <text x="511.5" y="103" class="small muted" text-anchor="middle">Attachment</text>
  <path d="M338 117L565 117" class="rule"/>
  <text x="349" y="142" class="label" text-anchor="start">All items</text>
  <text x="553" y="142" class="small muted" text-anchor="end">11 items</text>
  <rect x="344" y="151" width="215" height="48" rx="4" class="select"/>
  <path d="M345 154L345 196" class="edge"/>
  <text x="351" y="171" class="label" text-anchor="start">Attention Is All You Need</text>
  <text x="351" y="190" class="small muted" text-anchor="start">2017 · Ashish Vaswani et al.</text>
  <path d="M351 224L516 224" class="placeholder"/>
  <path d="M351 238L468 238" class="placeholder"/>
  <path d="M351 277L509 277" class="placeholder"/>
  <path d="M351 291L459 291" class="placeholder"/>
  <path d="M351 330L502 330" class="placeholder"/>
  <path d="M351 344L450 344" class="placeholder"/>
  <path d="M351 383L495 383" class="placeholder"/>
  <path d="M351 397L441 397" class="placeholder"/>
  <path d="M351 436L488 436" class="placeholder"/>
  <path d="M351 450L432 450" class="placeholder"/>
  <path d="M351 489L481 489" class="placeholder"/>
  <path d="M351 503L423 503" class="placeholder"/>
  </g>
  <g id="item-inspector">
  <path d="M565 76L565 500" class="rule"/>
  <text x="577" y="100" class="small muted" text-anchor="start">Conference paper</text>
  <text x="577" y="125" class="lead" text-anchor="start">Attention Is All You Need</text>
  <text x="577" y="150" class="small muted" text-anchor="start">Ashish Vaswani; Noam Shazeer;</text>
  <text x="577" y="169" class="small muted" text-anchor="start">Niki Parmar; Jakob Uszkoreit et al.</text>
  <text x="577" y="188" class="small muted" text-anchor="start">NeurIPS 30 · 2017-12</text>
  <rect x="577" y="207" width="83" height="26" rx="4" class="select border"/>
  <text x="618.5" y="225" class="small label accent" text-anchor="middle">Read PDF</text>
  <rect x="666" y="207" width="100" height="26" rx="4" class="paper border"/>
  <text x="716.0" y="225" class="small" text-anchor="middle">Parse PDF</text>
  <rect x="577" y="241" width="104" height="26" rx="4" class="paper border"/>
  <text x="629.0" y="259" class="small" text-anchor="middle">Copy citation</text>
  <rect x="687" y="241" width="99" height="26" rx="4" class="paper border"/>
  <text x="736.5" y="259" class="small" text-anchor="middle">Export</text>
  <path d="M565 282L800 282" class="rule"/>
  <text x="577" y="308" class="label" text-anchor="start">Abstract</text>
  <text x="577" y="335" class="small" text-anchor="start">The dominant sequence</text>
  <text x="577" y="354" class="small" text-anchor="start">transduction models are based</text>
  <text x="577" y="373" class="small" text-anchor="start">on complex recurrent or</text>
  <text x="577" y="392" class="small" text-anchor="start">convolutional neural networks…</text>
  <path d="M565 414L800 414" class="rule"/>
  <text x="577" y="441" class="label" text-anchor="start">Info</text>
  <text x="577" y="467" class="small mono accent" text-anchor="start">arXiv:1706.03762</text>
  </g>
  </g>
  <g id="mineru-confirmation">
  <rect width="800" height="500" fill="#1e293b" opacity=".28"/>
  <rect x="180" y="118" width="440" height="264" rx="9" class="paper border"/>
  <text x="196" y="150" class="heading" text-anchor="start">Parse document with MinerU</text>
  <path d="M4 4l8 8m0-8-8 8" transform="translate(588 135)" class="icon"/>
  <text x="196" y="186" class="small muted" text-anchor="start">Selected document</text>
  <text x="334" y="186" class="label" text-anchor="start">PDF full text</text>
  <text x="196" y="213" class="small muted" text-anchor="start">External service</text>
  <text x="334" y="213" class="label warning" text-anchor="start">MinerU (mineru.net)</text>
  <text x="196" y="240" class="small muted" text-anchor="start">Submission mode</text>
  <text x="334" y="240" class="label" text-anchor="start">Agent Lightweight Parse</text>
  <rect x="195" y="253" width="410" height="74" rx="4" class="warning-bg"/>
  <text x="205" y="273" class="small warning" text-anchor="start">Up to 10 MB and 20 pages per PDF.</text>
  <text x="205" y="293" class="small warning" text-anchor="start">Parsing is in progress in the background.</text>
  <text x="205" y="313" class="small warning" text-anchor="start">To stop, choose “Cancel parsing”.</text>
  <rect x="271" y="336" width="131" height="26" rx="4" class="paper border"/>
  <path d="M13.5 5a6 6 0 1 0 .4 4.3M13.5 1.8v3.8H9.6" transform="translate(277 341)" class="icon"/>
  <text x="297" y="354" class="small" text-anchor="start">Refresh status</text>
  <rect x="412" y="336" width="191" height="26" rx="4" class="select border"/>
  <text x="507.5" y="354" class="small label accent" text-anchor="middle">Submit PDF to MinerU</text>
  </g>
  </g>
  <rect x="0.5" y="0.5" width="799" height="499" rx="10" class="border" fill="none"/>
</svg>
