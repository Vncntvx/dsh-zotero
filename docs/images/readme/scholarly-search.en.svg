<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Scholarly tool calls and index rate limits in chat</title>
  <desc id="desc">The agent searches for 2026 papers in journals rated AJG 4 or higher, then follows up with targeted queries after rate limits.</desc>
  <style>
    text { fill: #1e293b; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .small { font-size: 14px; }
    .muted { fill: #526378; }
    .label { font-weight: 600; }
    .heading { font-size: 22px; font-weight: 650; }
    .lead { font-size: 18px; font-weight: 600; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .math { font: 26px Georgia, "Times New Roman", serif; }
    .paper { fill: #fff; }
    .pane { fill: #f8fafc; }
    .chrome { fill: #f1f5f9; }
    .code { fill: #edf2f7; }
    .select { fill: #0d9488; fill-opacity: .11; }
    .accent { fill: #0f766e; }
    .warning { fill: #92400e; }
    .warning-bg { fill: #fffbeb; }
    .border { stroke: #94a3b8; stroke-opacity: .65; }
    .rule { stroke: #94a3b8; stroke-opacity: .42; }
    .edge { stroke: #0d9488; stroke-width: 2; }
    .placeholder { stroke: #1e293b; stroke-opacity: .17; stroke-width: 3; stroke-linecap: round; }
    .icon { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <clipPath id="application-clip"><rect x="0" y="0" width="800" height="500" rx="10"/></clipPath>
  </defs>
  <g id="application" clip-path="url(#application-clip)">
  <rect x="0" y="0" width="800" height="500" rx="0" class="paper"/>
  <rect x="0" y="0" width="34" height="500" rx="0" class="chrome"/>
  <path d="M34 0L34 500" class="rule"/>
  <rect x="35" y="0" width="765" height="61" rx="0" class="pane"/>
  <path d="M34 61L800 61" class="rule"/>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(9 13)" class="icon"/>
  <path d="M8 3v10M3 8h10" transform="translate(9 56)" class="icon"/>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(9 89)" class="icon"/>
  <path d="M1.5 4h5l1.7 2h6.3v6.5h-13ZM1.5 4V2.8h5L8 4h5v2" transform="translate(9 122)" class="icon"/>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(9 155)" class="icon"/>
  <text x="48" y="22" class="small label" text-anchor="start">LLMs in management science</text>
  <rect x="42" y="33" width="48" height="25" rx="4" class="select"/>
  <path d="M49 59L83 59" class="edge"/>
  <text x="50" y="51" class="small label accent" text-anchor="start">Chat</text>
  <text x="101" y="51" class="small muted" text-anchor="start">Trace</text>
  <text x="152" y="51" class="small muted" text-anchor="start">Literature trail</text>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(774 11)" class="icon"/>
  <g id="user-question">
  <rect x="184" y="74" width="576" height="58" rx="6" class="chrome"/>
  <text x="198" y="97" class="" text-anchor="start">Find recent 2026 papers on LLMs in management science</text>
  <text x="198" y="119" class="" text-anchor="start">published in journals rated AJG 4 or higher.</text>
  </g>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(77 153)" class="icon"/>
  <text x="102" y="166" class="small mono accent" text-anchor="start">scholarly_search</text>
  <text x="279" y="166" class="" text-anchor="start">large language models management science 2026</text>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(77 184)" class="icon"/>
  <text x="102" y="197" class="small mono accent" text-anchor="start">scholarly_search</text>
  <text x="279" y="197" class="" text-anchor="start">LLM decision making operations management 2026</text>
  <rect x="76" y="216" width="684" height="59" rx="5" class="warning-bg border"/>
  <text x="88" y="239" class="warning" text-anchor="start">OpenAlex / Semantic Scholar rate-limited (429). DBLP challenge.</text>
  <text x="88" y="260" class="warning" text-anchor="start">Mostly arXiv preprints. Continuing with targeted source and journal searches.</text>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(77 293)" class="icon"/>
  <text x="102" y="306" class="small mono accent" text-anchor="start">scholarly_search</text>
  <text x="279" y="306" class="" text-anchor="start">large language model operations management</text>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(77 324)" class="icon"/>
  <text x="102" y="337" class="small mono accent" text-anchor="start">scholarly_search</text>
  <text x="279" y="337" class="" text-anchor="start">generative AI large language model Management Science journal</text>
  <path d="M3 1.5h6l4 4v9H3Zm6 0v4h4M5.5 8h5m-5 3h5" transform="translate(77 356)" class="icon"/>
  <text x="102" y="369" class="small muted" text-anchor="start">Web fetch</text>
  <text x="279" y="369" class="small" text-anchor="start">github.com/xiaoyangyyy/abs-journals</text>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(77 398)" class="icon"/>
  <text x="102" y="411" class="small mono accent" text-anchor="start">scholarly_get</text>
  <text x="279" y="411" class="" text-anchor="start">10.1177/10591478261474243</text>
  <g id="composer">
  <rect x="76" y="453" width="684" height="36" rx="7" class="pane border"/>
  <path d="M8 3v10M3 8h10" transform="translate(85 463)" class="icon"/>
  <text x="109" y="476" class="small muted" text-anchor="start">Send a message or create a task</text>
  <rect x="736" y="465" width="10" height="10" rx="2" class="accent"/>
  </g>
  </g>
  <rect x="0.5" y="0.5" width="799" height="499" rx="10" class="border" fill="none"/>
</svg>
