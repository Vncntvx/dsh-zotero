  <path d="M63 306L424 306" class="placeholder"/>
  <path d="m4 6 4 4 4-4" transform="translate(48 333)" class="icon"/>
  <text x="73" y="345" class="small mono label" text-anchor="start">wei_chain--thought_2022</text>
  <text x="73" y="365" class="small muted" text-anchor="start">Chain-of-Thought Prompting Elicits Reasoning in Large Language Models</text>
