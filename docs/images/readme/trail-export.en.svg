  <path d="m4 6 4 4 4-4" transform="translate(48 150)" class="icon"/>
  <text x="73" y="163" class="mono label" text-anchor="start">brown_language_2020</text>
  <rect x="576" y="145" width="80" height="26" rx="4" class="paper border"/>
  <text x="616.0" y="163" class="small" text-anchor="middle">\cite{…}</text>
  <rect x="664" y="145" width="122" height="26" rx="4" class="paper border"/>
  <text x="725.0" y="163" class="small" text-anchor="middle">Download .bib</text>
  <rect x="48" y="181" width="738" height="139" rx="5" class="code border"/>
  <rect x="49" y="182" width="736" height="26" rx="4" class="chrome"/>
  <text x="60" y="200" class="small mono muted" text-anchor="start">bibtex</text>
  <text x="774" y="200" class="small" text-anchor="end">Copy</text>
  <text x="61" y="229" class="mono" text-anchor="start">@inproceedings{brown_language_2020,</text>
  <text x="61" y="250" class="mono" text-anchor="start">  title = {Language {Models} are {Few}-{Shot} {Learners}},</text>
  <text x="61" y="271" class="mono" text-anchor="start">  url = {https://arxiv.org/abs/2005.14165},</text>
