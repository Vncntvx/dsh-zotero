  <text x="725.0" y="346" class="small" text-anchor="middle">Download .bib</text>
  <path d="m4 6 4 4 4-4" transform="translate(48 381)" class="icon"/>
  <text x="73" y="393" class="small mono label" text-anchor="start">shannon_mathematical_1948</text>
  <text x="73" y="413" class="small muted" text-anchor="start">A Mathematical Theory of Communication</text>
  <rect x="664" y="376" width="122" height="26" rx="4" class="paper border"/>
  <text x="725.0" y="394" class="small" text-anchor="middle">Download .bib</text>
  </g>
  <g id="composer">
  <rect x="76" y="453" width="684" height="36" rx="7" class="pane border"/>
  <path d="M8 3v10M3 8h10" transform="translate(85 463)" class="icon"/>
  <text x="109" y="476" class="small muted" text-anchor="start">Send a message or create a task</text>
  <path d="M8 13V3M4 7l4-4 4 4" transform="translate(735 463)" class="icon"/>
  </g>
  </g>
  <rect x="0.5" y="0.5" width="799" height="499" rx="10" class="border" fill="none"/>
