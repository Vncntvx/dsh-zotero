  <path d="M1.5 4h5l1.7 2h6.3v6.5h-13ZM1.5 4V2.8h5L8 4h5v2" transform="translate(9 122)" class="icon"/>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(9 155)" class="icon"/>
  <text x="48" y="22" class="small label" text-anchor="start">Papers on the origins of the Transformer</text>
  <text x="50" y="51" class="small muted" text-anchor="start">Chat</text>
  <text x="101" y="51" class="small muted" text-anchor="start">Trace</text>
  <rect x="144" y="33" width="125" height="25" rx="4" class="select"/>
  <path d="M151 59L262 59" class="edge"/>
  <text x="152" y="51" class="small label accent" text-anchor="start">Literature trail</text>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(774 11)" class="icon"/>
  <rect x="35" y="62" width="765" height="44" rx="0" class="pane"/>
  <path d="M35 106L800 106" class="rule"/>
  <circle cx="50" cy="83" r="3" class="accent"/>
  <text x="59" y="88" class="small" text-anchor="start">Connected to Zotero</text>
  <rect x="197" y="70" width="88" height="26" rx="4" class="paper border"/>
  <text x="241.0" y="88" class="small" text-anchor="middle">Literature</text>
  <rect x="289" y="70" width="89" height="26" rx="4" class="select border"/>
  <text x="333.5" y="88" class="small label accent" text-anchor="middle">Exports 3</text>
  <text x="391" y="88" class="small muted" text-anchor="start">12 items · 13 passages · 3 exports</text>
  <text x="783" y="88" class="small muted" text-anchor="end">Refresh</text>
