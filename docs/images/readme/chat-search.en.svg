<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Zotero search in chat</title>
  <desc id="desc">A local library question, tool calls, and paper and note counts for five queries.</desc>
  <style>
    text { fill: #1e293b; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .small { font-size: 14px; }
    .muted { fill: #526378; }
    .label { font-weight: 600; }
    .heading { font-size: 22px; font-weight: 650; }
    .lead { font-size: 18px; font-weight: 600; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .math { font: 26px Georgia, "Times New Roman", serif; }
    .paper { fill: #fff; }
    .pane { fill: #f8fafc; }
    .chrome { fill: #f1f5f9; }
    .code { fill: #edf2f7; }
    .select { fill: #0d9488; fill-opacity: .11; }
    .accent { fill: #0f766e; }
    .warning { fill: #92400e; }
    .warning-bg { fill: #fffbeb; }
    .border { stroke: #94a3b8; stroke-opacity: .65; }
    .rule { stroke: #94a3b8; stroke-opacity: .42; }
    .edge { stroke: #0d9488; stroke-width: 2; }
    .placeholder { stroke: #1e293b; stroke-opacity: .17; stroke-width: 3; stroke-linecap: round; }
    .icon { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <clipPath id="application-clip"><rect x="0" y="0" width="800" height="500" rx="10"/></clipPath>
  </defs>
  <g id="application" clip-path="url(#application-clip)">
  <rect x="0" y="0" width="800" height="500" rx="0" class="paper"/>
  <rect x="0" y="0" width="34" height="500" rx="0" class="chrome"/>
  <path d="M34 0L34 500" class="rule"/>
  <rect x="35" y="0" width="765" height="61" rx="0" class="pane"/>
  <path d="M34 61L800 61" class="rule"/>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(9 13)" class="icon"/>
  <path d="M8 3v10M3 8h10" transform="translate(9 56)" class="icon"/>
  <path d="M8 1.5 9.8 6.2 14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z" transform="translate(9 89)" class="icon"/>
  <path d="M1.5 4h5l1.7 2h6.3v6.5h-13ZM1.5 4V2.8h5L8 4h5v2" transform="translate(9 122)" class="icon"/>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(9 155)" class="icon"/>
  <text x="48" y="22" class="small label" text-anchor="start">Papers on the origins of the Transformer</text>
  <rect x="42" y="33" width="48" height="25" rx="4" class="select"/>
  <path d="M49 59L83 59" class="edge"/>
  <text x="50" y="51" class="small label accent" text-anchor="start">Chat</text>
  <text x="101" y="51" class="small muted" text-anchor="start">Trace</text>
  <text x="152" y="51" class="small muted" text-anchor="start">Literature trail</text>
  <path d="M1.8 2.5h12.4v11H1.8Zm8.5 0v11" transform="translate(774 11)" class="icon"/>
  <g id="user-question">
  <rect x="229" y="74" width="531" height="58" rx="6" class="chrome"/>
  <text x="243" y="97" class="" text-anchor="start">Find papers in my Zotero library on the origins of the Transformer.</text>
  <text x="243" y="119" class="" text-anchor="start">Trace each paper’s contribution chronologically.</text>
  </g>
  <text x="76" y="160" class="small muted" text-anchor="start">Completed in 50 seconds</text>
  <path d="M76 172L760 172" class="rule"/>
  <text x="76" y="199" class="lead" text-anchor="start">Tools called</text>
  <path d="M3 1.5h6l4 4v9H3Zm6 0v4h4M5.5 8h5m-5 3h5" transform="translate(77 215)" class="icon"/>
  <text x="102" y="228" class="small mono accent" text-anchor="start">skill</text>
  <text x="279" y="228" class="" text-anchor="start">Loaded zotero-research-landscape</text>
  <path d="M77 249L543 249" class="placeholder"/>
  <path d="M77 263L390 263" class="placeholder"/>
  <text x="76" y="302" class="label" text-anchor="start">Search scope · Local Zotero library</text>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(77 314)" class="icon"/>
  <text x="102" y="327" class="small mono accent" text-anchor="start">zotero_search</text>
  <text x="279" y="327" class="" text-anchor="start">“Transformer”</text>
  <text x="535" y="327" class="small label" text-anchor="start">1 paper found</text>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(77 337)" class="icon"/>
  <text x="102" y="350" class="small mono accent" text-anchor="start">zotero_search</text>
  <text x="279" y="350" class="" text-anchor="start">“Attention Is All You Need”</text>
  <text x="535" y="350" class="small label" text-anchor="start">1 paper found</text>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(77 360)" class="icon"/>
  <text x="102" y="373" class="small mono accent" text-anchor="start">zotero_search</text>
  <text x="279" y="373" class="" text-anchor="start">“attention”</text>
  <text x="535" y="373" class="small label" text-anchor="start">1 paper found</text>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(77 383)" class="icon"/>
  <text x="102" y="396" class="small mono accent" text-anchor="start">zotero_search</text>
  <text x="279" y="396" class="" text-anchor="start">“BERT”</text>
  <text x="535" y="396" class="small label" text-anchor="start">2 papers found</text>
  <path d="M9.8 9.8l3.5 3.5M10.6 6.4a4.2 4.2 0 1 0-8.4 0 4.2 4.2 0 0 0 8.4 0Z" transform="translate(77 406)" class="icon"/>
  <text x="102" y="419" class="small mono accent" text-anchor="start">zotero_search</text>
  <text x="279" y="419" class="" text-anchor="start">“GPT”</text>
  <text x="535" y="419" class="small label" text-anchor="start">0 papers found (+1 note)</text>
  <g id="composer">
  <rect x="76" y="453" width="684" height="36" rx="7" class="pane border"/>
  <path d="M8 3v10M3 8h10" transform="translate(85 463)" class="icon"/>
  <text x="109" y="476" class="small muted" text-anchor="start">Send a message or create a task</text>
  <path d="M8 13V3M4 7l4-4 4 4" transform="translate(735 463)" class="icon"/>
  </g>
  </g>
  <rect x="0.5" y="0.5" width="799" height="499" rx="10" class="border" fill="none"/>
</svg>
