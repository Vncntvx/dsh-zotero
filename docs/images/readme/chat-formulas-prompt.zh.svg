  <g id="user-question">
  <rect x="189" y="74" width="571" height="58" rx="6" class="chrome"/>
  <text x="203" y="97" class="" text-anchor="start">Attention Is All You Need 里多头注意力的公式和定义是怎么写的？</text>
  <text x="203" y="119" class="" text-anchor="start">引用原文并标明出处。</text>
  </g>
  <text x="76" y="158" class="small muted" text-anchor="start">已完成，用时 23 秒</text>
  <text x="76" y="191" class="heading" text-anchor="start">出处</text>
  <rect x="76" y="204" width="684" height="120" rx="5" class="pane border"/>
  <text x="89" y="227" class="lead" text-anchor="start">Attention Is All You Need</text>
  <text x="89" y="248" class="small" text-anchor="start">Vaswani et al. · Advances in Neural Information Processing Systems 30 · 2017</text>
  <text x="89" y="271" class="small label accent" text-anchor="start">PDF 全文 · 索引覆盖 15/15 页（完整）</text>
  <text x="746" y="271" class="small mono accent" text-anchor="end">arXiv:1706.03762</text>
  <text x="89" y="294" class="small muted" text-anchor="start">§3.2.1 · 全文分块 8/32–9/32</text>
  <text x="89" y="314" class="small muted" text-anchor="start">§3.2.2 · 全文分块 9/32–10/32</text>
  <text x="76" y="345" class="lead" text-anchor="start">1. 注意力的一般定义（§3.2 开头）</text>
  <rect x="76" y="354" width="684" height="92" rx="4" class="select"/>
  <path d="M77 357L77 443" class="edge"/>
  <text x="88" y="372" class="" text-anchor="start">An attention function can be described as mapping a query and a set of</text>
  <text x="88" y="388" class="" text-anchor="start">key-value pairs to an output, where the query, keys, values, and output</text>
  <text x="88" y="404" class="" text-anchor="start">are all vectors. The output is computed as a weighted sum of the values,</text>
  <text x="88" y="420" class="" text-anchor="start">where the weight assigned to each value is computed by a compatibility function</text>
  <text x="88" y="436" class="" text-anchor="start">of the query with the corresponding key.</text>
  <g id="composer">
