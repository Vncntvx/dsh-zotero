# This patch is used when the plugin is installed as a dsh bundle.
# The `name` refers to the package name, so Node module resolution can find it.
- insert:
    - id: zotero
      name: dsh-zotero
      config: {}
    # The scholarly component is optional: it reaches external indexes, which
    # is a deployment decision, not a default. A profile enables it by setting
    # `disabled: false` on this row (projection: the plugin manager writes the
    # same literal `disabled` value).
    - id: scholarly
      name: dsh-zotero/scholarly
      config: {}
      disabled: true
