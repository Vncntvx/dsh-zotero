# This patch is used when the plugin is installed as a dsh bundle.
# The `name` refers to the package name, so Node module resolution can find it.
- insert:
    - id: zotero
      name: dsh-zotero
      config: {}
    # The library component provides the library panel (collections tree,
    # multi-dimensional filters, item inspector, and approved personal-library writes).
    - id: library
      name: dsh-zotero/library
      config:
        rightSidebarEnabled: true
    # The scholarly component provides external academic literature retrieval
    # (arXiv, OpenAlex, Crossref, Semantic Scholar, PubMed, Europe PMC, DBLP).
    # It ships off. Its row's switch in the plugin manager's "Included
    # components" list is the only authorization: mounting the component
    # registers its seven tools and permits requests to the allowlisted
    # external indexes; the open-access PDF fulltext arm is the single
    # allowlist exception and is guarded by the public-address gates.
    - id: scholarly
      name: dsh-zotero/scholarly
      disabled: true
    # The enrichment component makes three independent capabilities available:
    # user-submitted MinerU document parsing, read-only reuse of existing
    # parsed artifacts, and local semantic passage ranking with its pinned
    # embedding models. It ships off. Mounting the row registers no model
    # tools and injects no prompt section. Enabling the component is the
    # deployment's acceptance of document egress to MinerU; it starts no work.
    # Ordinary reads use the core's read-only FulltextEnhancer.lookup slot to
    # reuse valid Markdown for the same source; a miss continues through the
    # existing Zotero fulltext index or authorized local PDF extraction. Only
    # an explicit user submission of one specific Zotero PDF attachment or one
    # public PDF URL starts a MinerU parse, with remote-action and session
    # access checks. PDF opening, settings saves, and service startup never
    # submit, resume, or upload a MinerU task.
    # Local semantic ranking needs no MinerU call or upload permission. With
    # semantic search enabled but its model missing, corrupt, or its runtime
    # unavailable, a read fails explicitly with
    # ZOTERO_ENRICHMENT_SEMANTIC_UNAVAILABLE; it never falls back to BM25.
    # Model downloads are separate operations from the component's own service
    # and vanish on unmount. No legacy component, config, cache-format, or
    # interface aliases are provided.
    - id: enrichment
      name: dsh-zotero/enrichment
      disabled: true
