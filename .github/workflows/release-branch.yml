name: Update Release Branch

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run deterministic release gate
        run: npm run release:check

      - name: Prepare verified release artifact
        run: node scripts/release-artifact.mjs --out "$RUNNER_TEMP/release-artifact" --source-sha "${{ github.sha }}"

      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  web-composition:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install dsh CLI at the pinned harness version
        run: |
          # The smoke installs the packed plugin into a real dsh profile, and CI
          # has no sibling harness checkout to take the CLI from; use the
          # published CLI at the exact version the dev tree pins. The CLI's
          # plugin manager spawns pnpm from PATH, so install the version the
          # harness pins in its packageManager field alongside it.
          pinned="$(node -p "require('./package.json').devDependencies['@deepseek-ai/dsh-api-remotes']")"
          npm install --global "@deepseek-ai/dsh@${pinned}" pnpm@11.28.5

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifact

      - name: Verify release artifact
        run: node scripts/release-artifact.mjs --verify --out "$RUNNER_TEMP/release-artifact" --source-sha "${{ github.sha }}"

      - name: Run packed Web composition smoke
        run: |
          tarball="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { join } from "node:path"; const dir=join(process.env.RUNNER_TEMP,"release-artifact"); console.log(join(dir,JSON.parse(readFileSync(join(dir,"artifact.json"),"utf8")).tarball))')"
          npm run smoke:web-composition -- --tarball "$tarball"

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - quality-gate
      - web-composition

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifact

      - name: Push verified release artifact
        env:
          RELEASE_PUSH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release-branch.mjs --push --artifact "$RUNNER_TEMP/release-artifact" --source-sha "${{ github.sha }}"
