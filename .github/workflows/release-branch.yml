name: Update Release Branch

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic release gate
        run: npm run release:check

  web-composition:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install dsh CLI at the pinned harness version
        run: |
          # The smoke installs the packed plugin into a real dsh profile, and CI
          # has no sibling harness checkout to take the CLI from; use the
          # published CLI at the exact version the dev tree pins.
          pinned="$(node -p "require('./package.json').devDependencies['@deepseek-ai/dsh-api-remotes']")"
          npm install --global "@deepseek-ai/dsh@${pinned}"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run packed Web composition smoke
        run: npm run smoke:web-composition

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - quality-gate
      - web-composition

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and push release branch
        run: node scripts/publish-release-branch.mjs --push --source-sha "${{ github.sha }}"
