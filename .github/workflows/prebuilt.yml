name: Build Prebuilt Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build prebuilt package
        run: npm run build

      - name: Prepare verified prebuilt package
        run: node scripts/release-artifact.mjs --out "$RUNNER_TEMP/release-artifact" --source-sha "${{ github.sha }}"

      - name: Update the rolling release branch
        env:
          RELEASE_PUSH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release-branch.mjs --push --branch release --artifact "$RUNNER_TEMP/release-artifact" --source-sha "${{ github.sha }}"
