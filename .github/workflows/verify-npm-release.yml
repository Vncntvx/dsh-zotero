name: Verify npm Release

on:
  workflow_run:
    workflows: [Update Release Branch]
    types: [completed]

jobs:
  verify-npm-release:
    name: Verify public npm package and create GitHub Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/release-branch.yml' &&
      startsWith(github.event.workflow_run['head_branch'], 'v')
    environment: npm-publication
    concurrency:
      group: verify-npm-release-${{ github.event.workflow_run['head_branch'] }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_SOURCE: ${{ github.event.workflow_run['head_sha'] }}
      RELEASE_TAG: ${{ github.event.workflow_run['head_branch'] }}

    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the verification scripts from the commit that produced the artifact.
          ref: ${{ github.event.workflow_run['head_sha'] }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact-${{ github.event.workflow_run['head_sha'] }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-artifact

      - name: Download and verify the public npm tarball
        run: node scripts/npm-registry.mjs --verify --out "$RUNNER_TEMP/release-artifact" --source-sha "$RELEASE_SOURCE"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          version="$(node -p 'require(process.env.RUNNER_TEMP + "/release-artifact/package/package.json").version')"
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match verified version $version" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
          if [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$RELEASE_SOURCE" ]; then
            echo "Tag $tag no longer points at $RELEASE_SOURCE" >&2
            exit 1
          fi
          # Signed tags put the PGP signature in %(contents); stop at it so the
          # release notes show only the human-written annotation.
          tag_body="$(git tag -l --format='%(contents)' "$tag" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d')"
          generated="$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$tag" --jq .body)"
          artifact_digest="$(node -p 'require(process.env.RUNNER_TEMP + "/release-artifact/artifact.json").artifactDigest')"
          tarball_sha256="$(node -p 'require(process.env.RUNNER_TEMP + "/release-artifact/artifact.json").tarballSha256')"
          {
            if [ -n "$tag_body" ]; then printf '%s\n\n' "$tag_body"; fi
            printf '%s\n' "$generated"
            printf '\n---\n\n**Publication provenance**\n\n'
            printf -- '- Source commit: `%s`\n' "$RELEASE_SOURCE"
            printf -- '- artifactDigest: `%s`\n' "$artifact_digest"
            printf -- '- tarballSha256: `%s`\n' "$tarball_sha256"
          } > "$RUNNER_TEMP/release-notes.md"
          release_flags=()
          if [[ "$version" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refreshing its notes."
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md" "${release_flags[@]}"
          else
            gh release create "$tag" --title "$tag" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" "${release_flags[@]}"
          fi
